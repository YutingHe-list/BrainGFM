data_dir: ./data/BrainGFM
dataset_name: braingfm
image_size: 256
braingfm_index_json: ./data/BrainGFM/.braingfm_index_{split}.json
braingfm_modalities: [t1, t2, t1ce, flair, dwi, ct, unknow]
braingfm_min_brain_ratio: 0.0
braingfm_use_merged_mask: true
braingfm_val_slice_cap: 0
braingfm_rot90_aug: true

gpus: 4
batch_size: 2
num_epochs: 100
learning_rate: 1.0e-4
weight_decay: 0.02
weight_decay_end: 0.0
lr_scheduler: lin0
lr_warmup_steps: 0.01
wp0: 0.005
wpe: 0.01
clip: 2.0
mixed_precision: bf16
log_interval: 50
save_interval: 2000
early_stop_patience: 0
val_max_batches: 64
seed: 42
run_name: d12_braingfm

# lesion_weighted_loss: true
# lesion_interior_weight: 5.0
# lesion_boundary_weight: 10.0
# reset_schedule: false

depth: 12
num_classes: 7
vocab_size: 4096
z_channels: 32
ch: 160
v_patch_nums: [1, 2, 3, 4, 5, 6, 8, 10, 13, 16]
mask_type: interleave_append
cond_drop_rate: 0.1
vae_pretrained_path: pretrained/braingfm_pretrain.pth
d12_pretrained_path: pretrained/braingfm_d12.pth

cfg: [4.0, 4.0, 4.0]
top_k: 900
top_p: 0.96
vis_per_mod: 1

output_dir: experiments/d12_braingfm
